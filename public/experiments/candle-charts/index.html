<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candle Charts — Live Markets</title>
<link rel="stylesheet" href="style.css?v=05fe7fd94ee8">
<script src="lwc-4.0.1.js?v=575fe9c48279" defer></script>
</head>
<body>
<header class="topbar">
  <button type="button" id="btn-view" class="favourite-toggle sort-toggle" aria-pressed="false" aria-label="Live prices for your favourite tickers" title="Live prices for your favourite tickers">☰ List</button>
  <nav class="favourites" aria-label="Favourite tickers">
    <div class="favourites-scroll" id="favourites"></div>
  </nav>
  <div class="source-toggle" id="source-toggle" role="group" aria-label="Market source">
    <button type="button" data-source="binance" class="active">Binance Spot</button>
    <button type="button" data-source="hyperliquid">Hyperliquid</button>
    <button type="button" data-source="xyz">xyz</button>
  </div>
  <div class="instrument-row">
    <div class="symbol-select">
      <select id="symbol" aria-label="Market ticker"></select>
    </div>
    <button type="button" id="btn-vol-sort" class="favourite-toggle sort-toggle" aria-pressed="true" aria-label="Sort tickers by 24h volume" title="Sort tickers by 24h volume">↓ Vol</button>
    <button type="button" class="favourite-toggle" id="btn-favourite" aria-pressed="false" title="Add current ticker to favourites">☆</button>
    <button type="button" id="btn-alerts" class="alerts-button" aria-label="Manage price alerts" title="Price alerts">🔔 0</button>
    <div class="status" title="Live market connection">
      <div class="price-tag" id="last-price">—</div>
      <div class="live-dot" id="live-dot" aria-hidden="true">●</div>
    </div>
  </div>
  <div class="intervals" id="intervals"></div>
  <div class="indicators">
    <label><input type="checkbox" id="cb-ema" checked> EMA8</label>
    <label><input type="checkbox" id="cb-rsi" checked> RSI14</label>
    <label><input type="checkbox" id="cb-rsilv" checked> OB/OS</label>
    <div class="lvl-inputs" title="Overbought / Oversold thresholds"><label>OB <input type="number" id="in-ob" min="50" max="95" step="1"></label><label>OS <input type="number" id="in-os" min="5" max="50" step="1"></label></div>
    <label><input type="checkbox" id="cb-vol" checked> Vol</label>
  </div>
  <div class="tools">
    <button type="button" id="btn-hline" title="Horizontal price line">─ H-Line</button>
    <button type="button" id="btn-trend" title="Trendline (2 points)">／ Trend</button>
    <button type="button" id="btn-measure" title="Measure price/bar range (2 points) — drag the box to move it, drag a top/bottom grip to resize, click it to remove">📏 Measure</button>
    <button type="button" id="btn-clear" title="Clear all drawings and the measurement for this symbol">🗑 Clear</button>
  </div>
</header>

<main class="chart-area">
  <div class="legend" id="legend"></div>
  <div id="main-chart"></div>
  <div id="rsi-chart" class="rsi-pane"></div>
  <div id="watchlist" class="watchlist" aria-label="Live favourite tickers"></div>
</main>

<dialog id="alert-dialog" class="alert-sheet" aria-labelledby="alert-heading">
  <form id="alert-form">
    <h2 id="alert-heading">Create price alert</h2>
    <p id="alert-market"></p>
    <label for="alert-level">Crossing price</label>
    <input id="alert-level" type="number" inputmode="decimal" step="any" required autocomplete="off">
    <p id="alert-quote" class="alert-hint"></p>
    <p>Either direction · One shot · Expires in 1 year</p>
    <p class="alert-hint">Telegram only. Watches live trades on this market even when the chart is closed. Reaching or passing the level counts; creating the alert does not trigger it.</p>
    <p id="alert-error" class="alert-warning" role="alert"></p>
    <div class="alert-actions">
      <button type="button" id="alert-cancel">Cancel</button>
      <button type="submit" id="alert-create" class="alert-primary">Create alert</button>
    </div>
  </form>
</dialog>
<dialog id="alerts-manager" class="alert-sheet" aria-labelledby="alerts-heading">
  <div class="alert-sheet-heading"><h2 id="alerts-heading">Price alerts</h2><button type="button" id="alerts-close" aria-label="Close alerts">✕</button></div>
  <p id="alerts-status" class="alert-hint" role="status">Loading alerts…</p>
  <div class="alert-actions">
    <button type="button" id="alerts-new" class="alert-primary">＋ New alert</button>
    <button type="button" id="alerts-refresh">Refresh</button>
    <select id="alerts-filter" aria-label="Filter alerts">
      <option value="active">Active</option><option value="triggered">Triggered</option>
      <option value="expired">Expired</option><option value="cancelled">Cancelled</option><option value="all">All</option>
    </select>
  </div>
  <div id="alerts-list"></div>
</dialog>
<div id="alert-toast" role="status" hidden></div>
<script src="alerts.js?v=891492494a1b" defer></script>
<script src="watchlist.js?v=dc937f3a977e" defer></script>
<script src="app.js?v=5c869d7f8205" defer></script>
</body>
</html>
