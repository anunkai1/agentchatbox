<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="agentchatbox">
  <title>agentchatbox</title>
  <style>
    /* The eye glow breathes. Reduced-motion users get the static glow. */
    .acb-robot-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: acb-robot-pulse 2.4s ease-in-out infinite;
    }
    @keyframes acb-robot-pulse {
      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .acb-robot-glow {
        animation: none;
      }
    }
  </style>
  <defs>
    <linearGradient id="acb-robot-edge" x1="64" y1="72" x2="448" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="0.6" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="acb-robot-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8d6e6"/>
    </linearGradient>
    <radialGradient id="acb-robot-gloss" cx="0.35" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="acb-robot-glow">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M152 72H360A88 88 0 0 1 448 160V272A88 88 0 0 1 360 360H224L120 432L152 360A88 88 0 0 1 64 272V160A88 88 0 0 1 152 72Z" fill="#0a1f3b" stroke="url(#acb-robot-edge)" stroke-width="14" stroke-linejoin="round"/>
  <g transform="translate(256 214) scale(1.1) translate(-256 -214)">
    <rect x="136" y="186" width="30" height="60" rx="13" fill="url(#acb-robot-silver)"/>
    <rect x="346" y="186" width="30" height="60" rx="13" fill="url(#acb-robot-silver)"/>
    <circle cx="146" cy="216" r="6" fill="#0a1f3b"/>
    <circle cx="366" cy="216" r="6" fill="#0a1f3b"/>
    <rect x="236" y="292" width="40" height="20" rx="7" fill="#7fa6bf"/>
    <rect x="156" y="128" width="200" height="172" rx="62" fill="url(#acb-robot-silver)"/>
    <rect x="156" y="128" width="200" height="172" rx="62" fill="url(#acb-robot-gloss)"/>
    <rect x="180" y="174" width="152" height="82" rx="34" fill="#0a1f3b"/>
    <circle class="acb-robot-glow" cx="226" cy="214" r="26" fill="url(#acb-robot-glow)"/>
    <circle class="acb-robot-glow" cx="286" cy="214" r="26" fill="url(#acb-robot-glow)"/>
    <ellipse cx="226" cy="214" rx="13" ry="17" fill="#2ee6d6"/>
    <ellipse cx="286" cy="214" rx="13" ry="17" fill="#2ee6d6"/>
    <circle cx="222" cy="207" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="282" cy="207" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M232 276Q256 292 280 276" fill="none" stroke="#0a1f3b" stroke-width="8" stroke-linecap="round"/>
