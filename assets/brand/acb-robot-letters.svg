<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="agentchatbox">
  <title>agentchatbox</title>
  <style>
    /* The eye glow breathes. Reduced-motion users get the static glow. */
    .acb-robot-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: acb-robot-pulse 2.4s ease-in-out infinite;
    }
    @keyframes acb-robot-pulse {
      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .acb-robot-glow {
        animation: none;
      }
    }
  </style>
  <defs>
    <linearGradient id="acb-robot-edge" x1="64" y1="72" x2="448" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="0.6" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="acb-robot-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8d6e6"/>
    </linearGradient>
    <radialGradient id="acb-robot-glow">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M152 72H360A88 88 0 0 1 448 160V272A88 88 0 0 1 360 360H224L120 432L152 360A88 88 0 0 1 64 272V160A88 88 0 0 1 152 72Z" fill="#0a1f3b" stroke="url(#acb-robot-edge)" stroke-width="14" stroke-linejoin="round"/>
  <!-- The letters are the robot: C is the head, A and B flank it in one line. -->
  <g transform="translate(14 0)">
    <path d="M315 174.7A72 72 0 1 0 315 257.3" fill="none" stroke="url(#acb-robot-silver)" stroke-width="26"/>
    <path d="M90 256L126 176L162 256M105 228H147" fill="none" stroke="url(#acb-robot-silver)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 176V256M352 176H366A20 20 0 0 1 366 216H352M352 216H370A20 20 0 0 1 370 256H352" fill="none" stroke="url(#acb-robot-silver)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="210" y="186" width="92" height="52" rx="20" fill="#0a1f3b" stroke="url(#acb-robot-silver)" stroke-width="4"/>
    <circle class="acb-robot-glow" cx="237" cy="210" r="20" fill="url(#acb-robot-glow)"/>
    <circle class="acb-robot-glow" cx="275" cy="210" r="20" fill="url(#acb-robot-glow)"/>
    <ellipse cx="237" cy="210" rx="9" ry="12" fill="#2ee6d6"/>
    <ellipse cx="275" cy="210" rx="9" ry="12" fill="#2ee6d6"/>
    <circle cx="234" cy="205" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="272" cy="205" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M243 256Q256 265 269 256" fill="none" stroke="#2ee6d6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
