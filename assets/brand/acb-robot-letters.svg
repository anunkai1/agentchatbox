<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="agentchatbox">
  <title>agentchatbox</title>
  <style>
    /* The eye glow breathes. Reduced-motion users get the static glow. */
    .acb-robot-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: acb-robot-pulse 2.4s ease-in-out infinite;
    }
    @keyframes acb-robot-pulse {
      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .acb-robot-glow {
        animation: none;
      }
    }
  </style>
  <defs>
    <linearGradient id="acb-robot-edge" x1="64" y1="72" x2="448" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6d6"/>
      <stop offset="0.6" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="acb-robot-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8d6e6"/>
    </linearGradient>
    <radialGradient id="acb-robot-glow">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M152 72H360A88 88 0 0 1 448 160V272A88 88 0 0 1 360 360H224L120 432L152 360A88 88 0 0 1 64 272V160A88 88 0 0 1 152 72Z" fill="#0a1f3b" stroke="url(#acb-robot-edge)" stroke-width="14" stroke-linejoin="round"/>
  <!-- The letters are the robot: C is the head, A the crest, B the ear. -->
  <path d="M321.5 202.1A80 80 0 1 0 321.5 293.9" fill="none" stroke="url(#acb-robot-silver)" stroke-width="30"/>
  <path d="M206 167L256 100L306 167M226 140H286" fill="none" stroke="url(#acb-robot-silver)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M336 212V284M336 212H352A18 18 0 0 1 352 248H336M336 248H354A18 18 0 0 1 354 284H336" fill="none" stroke="url(#acb-robot-silver)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="137" y="230" width="22" height="36" rx="11" fill="url(#acb-robot-silver)"/>
  <circle cx="148" cy="248" r="4.5" fill="#0a1f3b"/>
  <rect x="201" y="218" width="110" height="60" rx="22" fill="#0a1f3b" stroke="url(#acb-robot-silver)" stroke-width="4"/>
  <circle class="acb-robot-glow" cx="232" cy="244" r="22" fill="url(#acb-robot-glow)"/>
  <circle class="acb-robot-glow" cx="280" cy="244" r="22" fill="url(#acb-robot-glow)"/>
  <ellipse cx="232" cy="244" rx="10" ry="14" fill="#2ee6d6"/>
  <ellipse cx="280" cy="244" rx="10" ry="14" fill="#2ee6d6"/>
  <circle cx="229" cy="238" r="2.8" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="277" cy="238" r="2.8" fill="#ffffff" fill-opacity="0.9"/>
  <path d="M236 292Q256 304 276 292" fill="none" stroke="#2ee6d6" stroke-width="6" stroke-linecap="round"/>
</svg>
